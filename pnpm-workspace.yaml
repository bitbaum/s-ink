# pnpm 11 blocks dependency build scripts by default; allow only what we trust.
allowBuilds:
  unrs-resolver: true

# @bitbaum/mail-kit 0.1.0 was published by us today; exempt it from the
# minimum-release-age supply-chain window (our own package, not third-party).
minimumReleaseAgeExclude:
  - '@bitbaum/mail-kit'

overrides:
  # Security floors (2026-10-30 dev-toolchain sweep): stay inside the
  # major the parents already allow; pnpm does not re-resolve these on update.
  'vite@8': '^8.2.4'
