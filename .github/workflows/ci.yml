# Golden CI floor — see dotfiles/templates/ci/README.md.
# s-ink: pnpm, no database, no services. `verify` (lint + typecheck + test +
# build) is the SSOT for what "green" means and is defined once in package.json,
# so this job and a local run check exactly the same things — including that
# every piece in the works manifest has its processed media, which the build
# alone cannot catch.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm before setup-node so `cache: pnpm` can find the store.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Next keeps its compiler output in .next/cache. Without restoring it,
      # every CI run recompiles the whole app from scratch — and the deploy
      # then compiles it a second time. Measured across the fleet on
      # 2026-09-07: of eight repos, exactly one cached this.
      #
      # Keyed on the lockfile so a dependency change invalidates it. The bare
      # restore-key is last on purpose: a stale cache still beats no cache,
      # and Next validates its own entries rather than trusting them.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm run verify
