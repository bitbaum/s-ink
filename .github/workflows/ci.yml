# Golden CI floor — see dotfiles/templates/ci/README.md.
# s-ink: npm, no database, no services. `verify` (lint + typecheck + test +
# build) is the SSOT for what "green" means and is defined once in package.json,
# so this job and a local run check exactly the same things — including that
# every piece in the works manifest has its processed media, which the build
# alone cannot catch.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify
