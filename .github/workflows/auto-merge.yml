# Auto-merge — nobody is in the merge loop.
#
# Green, ready PRs merge themselves and deploy themselves. The policy lives in
# ONE place for the whole fleet — bitbaum/fleet, scripts/ci/auto-merge-sweep.sh
# — and this file only says "run it, here, with these settings".
#
# It used to be a ~245-line copy of that script. Twenty-two repos held such a
# copy and they drifted into eight versions: this repo's was the oldest and had
# fallen furthest behind, missing both the red-base job matching (so a PR that
# fixed a broken base could never land) and the infra-failure re-run (so a
# cancelled CI run stranded the queue with no signal). Neither gap was this
# repo's fault; it simply never received fixes written elsewhere.
#
# The triggers stay here on purpose — they are genuinely per-repo. `workflow_run`
# must name the CI workflow exactly, and that name differs across the fleet.
#
# To stop all of this: delete this file, or add a `hold` label to a PR.
name: Auto-merge

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

# Declared on the CALLER as well as inside the reusable workflow. The token a
# called workflow receives is capped by what the caller grants, so relying on
# the callee's block alone can hand it a read-only token — and the sweep would
# then fail to merge anything while still exiting 0, which is indistinguishable
# from having nothing to merge.
permissions:
  contents: write # merge the PR
  pull-requests: write # read PR state, delete the branch
  actions: write # dispatch the re-arm workflows
  checks: read # statusCheckRollup — only load-bearing on private repos
  statuses: read

jobs:
  sweep:
    uses: bitbaum/fleet/.github/workflows/auto-merge-sweep.yml@main
    with:
      base_branch: main
      ci_workflow: ci.yml
      # SPACE-separated: the sweep word-splits this. A comma would become one
      # bogus token, every dispatch would fail, and the only symptom would be
      # that nothing deploys — while the sweep still reported success.
      rearm_workflows: 'ci.yml deploy.yml'
